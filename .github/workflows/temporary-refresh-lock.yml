name: Temporary npm lockfile refresh

on:
  push:
    branches:
      - fix/tailwind4-postcss-ci-20261105

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Refresh lockfile without upgrading unrelated dependencies
        run: |
          npm install --global npm@11
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit lockfile
        run: |
          if ! git diff --quiet -- package.json; then
            echo 'Unexpected package.json update' >&2
            exit 1
          fi
          git add package-lock.json
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'chore: lock Tailwind v4 PostCSS plugin dependencies'
            git push origin HEAD:fix/tailwind4-postcss-ci-20261105
          fi
